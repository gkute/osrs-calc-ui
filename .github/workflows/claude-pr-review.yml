name: Claude PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          classify_inline_comments: 'true'
          prompt: |
            Review this pull request thoroughly. For each issue found:
            - Post an inline comment on the specific line(s) where the problem is
            - Explain what the issue is and why it matters
            - Suggest a concrete fix where possible

            Focus on: bugs, incorrect logic, security issues, missing error handling,
            and anything that deviates from the patterns in CLAUDE.md.
            Do not comment on style or formatting unless it causes a functional problem.
